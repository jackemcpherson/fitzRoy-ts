name: CI

on:
  push:
    branches: [main]
  # Every pull request, so PRs stacked on another PR's branch get CI too.
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, and typecheck
        run: npx vp check

      - name: Typecheck (portable core, no Node types)
        run: npm run typecheck:portable

      - name: Test with coverage (thresholds enforced via vite.config.ts)
        run: npx vp test run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/

      - name: Build
        run: bun run build

      - name: Verify bundled CLI against golden output
        run: npx vp test run test/golden/cli.test.ts
        env:
          FITZROY_CLI_ENTRY: dist/cli.js

      - name: Verify npm consumer install
        run: npm run verify:package

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check type exports
        run: bunx attw --pack . --profile esm-only
