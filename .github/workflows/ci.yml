name: CI

on:
  push:
    branches: [main]
  # Every pull request, so PRs stacked on another PR's branch get CI too.
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # Installs Vite+, Node.js from .node-version and pnpm from packageManager,
      # then runs `vp install` (frozen lockfile on CI).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Format, lint, and typecheck
        run: vp check

      - name: Typecheck (portable core, no Node types)
        run: vp run typecheck:portable

      - name: Test with coverage (thresholds enforced via vite.config.ts)
        run: vp test run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/

      - name: Build
        run: vp run build

      - name: Verify bundled CLI against golden output
        run: vp test run test/golden/cli.test.ts
        env:
          FITZROY_CLI_ENTRY: dist/cli.js

      - name: Verify npm consumer install
        run: vp run verify:package

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check type exports
        run: vp exec attw --pack . --profile esm-only
