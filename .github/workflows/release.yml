name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3)"
        required: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve reviewed release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve version tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/resolve-release.sh

  check:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish-npm:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `id-token: write` is required for OIDC trusted-publisher auth against npm.
    # No static NPM_TOKEN is used — npm derives short-lived credentials from
    # the workflow's OIDC identity, provided the package is configured with a
    # GitHub trusted publisher pointing at this repo + workflow on npmjs.com.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Check immutable published version
        id: registry
        run: node scripts/verify-published-package.mjs

      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public

  build-binaries:
    needs: [resolve, check]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: fitzroy-macos-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: fitzroy-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: fitzroy-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile binary
        env:
          BINARY_TARGET: ${{ matrix.target }}
          BINARY_ARTIFACT: ${{ matrix.artifact }}
        run: |
          version=$(node -p "require('./package.json').version")
          bun build --compile --target="$BINARY_TARGET" src/cli.ts \
            --define "PACKAGE_VERSION=\"${version}\"" --outfile "$BINARY_ARTIFACT"
          "./$BINARY_ARTIFACT" --help
          [[ "$("./$BINARY_ARTIFACT" --version)" == "$version" ]]

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  create-release:
    needs: [resolve, publish-npm, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: |
            artifacts/fitzroy-macos-arm64/fitzroy-macos-arm64
            artifacts/fitzroy-linux-x64/fitzroy-linux-x64
            artifacts/fitzroy-linux-arm64/fitzroy-linux-arm64
