# Weekly liveness probe for the scraper sources (TST-03). Deliberately a
# separate workflow from ci.yml so a flaky upstream can never block CI.
# On failure it opens (or comments on) a "Scraper canary failure" issue.
name: Scraper canary

on:
  schedule:
    - cron: "0 20 * * 1" # Mondays 20:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Restore the row-count baseline from the previous run so the canary
      # can detect drift (>15% drop) rather than only catching zero-row
      # parser failures. First run won't find an artifact — that's fine.
      - name: Restore canary baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: canary-baseline
          path: scripts

      - name: Run canary
        run: bun scripts/canary.ts

      # Persist the updated baseline even when the canary fails — the new
      # counts are still useful for inspecting drift in the artifact.
      - name: Persist canary baseline
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: canary-baseline
          path: scripts/canary-baseline.json
          retention-days: 90

      - name: Open or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Scraper canary failure"
          body="The weekly scraper canary failed on $(date -u +%Y-%m-%dT%H:%M:%SZ). See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
