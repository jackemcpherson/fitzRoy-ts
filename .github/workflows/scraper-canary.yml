# Weekly liveness probe for the scraper sources (TST-03). Deliberately a
# separate workflow from ci.yml so a flaky upstream can never block CI.
# On failure it opens (or comments on) a "Scraper canary failure" issue.
name: Scraper canary

on:
  schedule:
    - cron: "0 20 * * 1" # Mondays 20:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Find previous successful canary run
        id: previous-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --workflow scraper-canary.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      # Restore the row-count baseline from the previous successful run so the canary
      # can detect drift (>15% drop) rather than only catching zero-row
      # parser failures. First run won't find an artifact — that's fine.
      # Artifacts expire after 90 days, so a missing artifact must not fail the
      # job: the canary then records a fresh baseline instead of comparing.
      - name: Restore canary baseline
        if: steps.previous-run.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-baseline
          path: scripts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-run.outputs.run-id }}

      - name: Run canary
        run: vp run canary

      # The baseline artifact always represents one fully successful run.
      - name: Persist canary baseline
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-baseline
          path: scripts/canary-baseline.json
          retention-days: 90

      - name: Open or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Scraper canary failure"
          body="The weekly scraper canary failed on $(date -u +%Y-%m-%dT%H:%M:%SZ). See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
